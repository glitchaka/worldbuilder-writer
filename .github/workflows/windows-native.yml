name: Windows native build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: worldbuilder-writer-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:\Qt --modules qtmultimedia

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="C:\Qt\6.8.3\msvc2022_64"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Install standalone bundle
        shell: pwsh
        run: cmake --install build --config Release --prefix "${{ github.workspace }}\dist"

      - name: Smoke test deployed workspaces
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "${{ github.workspace }}\dist" -Recurse -Filter WorldbuilderWriter.exe | Select-Object -First 1
          if (-not $exe) {
            throw "The deployed bundle does not contain WorldbuilderWriter.exe"
          }

          $process = Start-Process -FilePath $exe.FullName `
            -ArgumentList "--smoke-all-workspaces" `
            -WorkingDirectory $exe.DirectoryName `
            -PassThru

          if (-not $process.WaitForExit(20000)) {
            Stop-Process -Id $process.Id -Force
            throw "The deployed application did not finish workspace traversal within 20 seconds"
          }

          if ($process.ExitCode -ne 0) {
            throw "The deployed application failed workspace traversal with exit code $($process.ExitCode)"
          }
