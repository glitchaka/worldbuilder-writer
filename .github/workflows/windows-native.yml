name: Windows RC build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: worldbuilder-writer-rc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:\Qt --modules qtmultimedia

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="C:\Qt\6.8.3\msvc2022_64"

      - name: Build release candidate
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Install standalone bundle
        shell: pwsh
        run: cmake --install build --config Release --prefix "$env:GITHUB_WORKSPACE\dist"

      - name: Upload Windows RC
        uses: actions/upload-artifact@v4
        with:
          name: WorldbuilderWriter-0.5.0-rc1-win64
          path: ${{ github.workspace }}/dist
          if-no-files-found: error
