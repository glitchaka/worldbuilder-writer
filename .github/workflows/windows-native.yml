name: Windows native validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: worldbuilder-writer-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:\Qt --modules qtmultimedia

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="C:\Qt\6.8.3\msvc2022_64"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Install standalone bundle
        shell: pwsh
        run: cmake --install build --config Release --prefix "$env:GITHUB_WORKSPACE\dist"

      - name: Smoke launch standalone app
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\bin\WorldbuilderWriter.exe"
          if (-not (Test-Path $exe)) {
            throw "Standalone executable was not installed at $exe"
          }
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "WorldbuilderWriter exited during smoke launch with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      - name: Product functional self-test
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\bin\WorldbuilderWriter.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--product-self-test" -WorkingDirectory (Split-Path $exe) -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          while (-not $process.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
            $process.Refresh()
          }
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force
            throw "Product self-test timed out after 60 seconds"
          }
          if ($process.ExitCode -ne 0) {
            throw "Product self-test failed with exit code $($process.ExitCode)"
          }

      - name: Upload validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: WorldbuilderWriter-validation-win64
          path: ${{ github.workspace }}/dist
          if-no-files-found: error
