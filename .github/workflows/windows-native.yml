name: Windows native build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:\Qt --modules qtmultimedia

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="C:\Qt\6.8.3\msvc2022_64"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "C:\Qt\6.8.3\msvc2022_64\bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure

      - name: RC workspace smoke
        shell: pwsh
        run: |
          $env:PATH = "C:\Qt\6.8.3\msvc2022_64\bin;$env:PATH"
          Remove-Item -Recurse -Force "$pwd\rc-qa" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$pwd\rc-qa" | Out-Null
          Push-Location "$pwd"
          & "$pwd\build\Release\WorldbuilderWriter.exe" --rc-smoke --qa-dir=rc-qa
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) {
            Get-Content "$pwd\rc-qa\rc-smoke.txt" -ErrorAction SilentlyContinue
            exit $code
          }
          if (!(Test-Path "$pwd\rc-qa\rc-smoke.txt")) { Write-Error "RC smoke did not create rc-smoke.txt"; exit 91 }
          $captures = @("library.png","writing.png","scenes.png","atlas.png","maps.png","review.png","settings.png")
          foreach ($capture in $captures) {
            if (!(Test-Path "$pwd\rc-qa\$capture")) { Write-Error "RC smoke missing $capture"; exit 92 }
          }
          Get-Content "$pwd\rc-qa\rc-smoke.txt"
          Get-ChildItem "$pwd\rc-qa" | Format-Table Name,Length

      - name: Upload RC visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WorldbuilderWriter-rc-qa
          path: rc-qa/
          if-no-files-found: error

      - name: Install standalone bundle
        shell: pwsh
        run: cmake --install build --config Release --prefix "$pwd\dist"

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: WorldbuilderWriter-win64
          path: dist/
          if-no-files-found: error
