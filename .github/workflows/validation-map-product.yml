name: Product validation

on:
  push:
    branches: [ validation/map-product ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:\Qt --modules qtmultimedia

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="C:\Qt\6.8.3\msvc2022_64"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Install standalone bundle
        shell: pwsh
        run: cmake --install build --config Release --prefix "$env:GITHUB_WORKSPACE\dist"

      - name: Validate standalone contents
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\bin\WorldbuilderWriter.exe'
          if (!(Test-Path $exe)) { throw 'WorldbuilderWriter.exe was not installed.' }
          foreach ($dll in @('Qt6Core.dll','Qt6Gui.dll','Qt6Widgets.dll')) {
            if (!(Test-Path (Join-Path (Split-Path $exe) $dll))) { throw "$dll missing from standalone bundle." }
          }
          if (!(Test-Path (Join-Path (Split-Path $exe) 'platforms\qwindows.dll'))) { throw 'Qt Windows platform plugin missing.' }

      - name: Native launch smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'minimal'
          $env:QT_PLUGIN_PATH = 'C:\Qt\6.8.3\msvc2022_64\plugins'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\bin\WorldbuilderWriter.exe'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          if ($process.HasExited) { throw "Worldbuilder Writer exited during startup with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force

      # Validation only. No RC/release artifact is published. Native spelling fix included.
