name: Product validation

on:
  push:
    branches: [ validation/map-product ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Integrate editable lakes to main
        shell: pwsh
        run: |
          $editor = 'src/ui/PilinReyEditorProduct.cpp'
          $text = Get-Content $editor -Raw

          $text = $text.Replace(
            'case PilinReyEditor::Tool::River: return QStringLiteral("river");',
            "case PilinReyEditor::Tool::River: return QStringLiteral(`"river`");`n        case PilinReyEditor::Tool::Lake: return QStringLiteral(`"lake`");")

          $oldNode = @'
          return tool == PilinReyEditor::Tool::River || tool == PilinReyEditor::Tool::Road ||
                 tool == PilinReyEditor::Tool::Border || tool == PilinReyEditor::Tool::Region;
          '@.Trim()
          $newNode = @'
          return tool == PilinReyEditor::Tool::River || tool == PilinReyEditor::Tool::Lake || tool == PilinReyEditor::Tool::Road ||
                 tool == PilinReyEditor::Tool::Border || tool == PilinReyEditor::Tool::Region;
          '@.Trim()
          if (-not $text.Contains($oldNode)) { throw 'Map node tool block not found.' }
          $text = $text.Replace($oldNode, $newNode)

          $text = $text.Replace(
            '{Tool::River, "∿", "Trazar río"}, {Tool::Road, "━", "Trazar ruta"},',
            '{Tool::River, "∿", "Trazar río"}, {Tool::Lake, "≈", "Dibujar lago"}, {Tool::Road, "━", "Trazar ruta"},')

          $text = $text.Replace(
            'if (tool_ == Tool::Region && value.size() >= 3) value.append(value.first());',
            'if ((tool_ == Tool::Region || tool_ == Tool::Lake) && value.size() >= 3) value.append(value.first());')

          $oldDraw = @'
                  } else if (type == QStringLiteral("road")) {
                      const QColor c = themeColor(p, QStringLiteral("road"), QColor(QStringLiteral("#75512f")));
          '@.Trim()
          $newDraw = @'
                  } else if (type == QStringLiteral("lake")) {
                      const QColor water = themeColor(p, QStringLiteral("river"), QColor(QStringLiteral("#2d6382")));
                      QColor fill = water.lighter(145);
                      fill.setAlpha(210);
                      painter.setPen(QPen(water.darker(135), std::max(1.0, width * .7), Qt::SolidLine, Qt::RoundCap, Qt::RoundJoin));
                      painter.setBrush(fill);
                      painter.drawPath(path);
                  } else if (type == QStringLiteral("road")) {
                      const QColor c = themeColor(p, QStringLiteral("road"), QColor(QStringLiteral("#75512f")));
          '@.Trim()
          if (-not $text.Contains($oldDraw)) { throw 'Map lake draw insertion point not found.' }
          $text = $text.Replace($oldDraw, $newDraw)

          $oldLabel = 'tool == Tool::River ? tr("Río") : tool == Tool::Road ? tr("Ruta")'
          $newLabel = 'tool == Tool::River ? tr("Río") : tool == Tool::Lake ? tr("Lago") : tool == Tool::Road ? tr("Ruta")'
          if (-not $text.Contains($oldLabel)) { throw 'Map active-tool label block not found.' }
          $text = $text.Replace($oldLabel, $newLabel)

          $oldObject = 'if (type == QStringLiteral("region")) { object.insert(QStringLiteral("closed"), true); object.insert(QStringLiteral("fillOpacity"), .12); }'
          $newObject = 'if (type == QStringLiteral("region") || type == QStringLiteral("lake")) { object.insert(QStringLiteral("closed"), true); object.insert(QStringLiteral("fillOpacity"), type == QStringLiteral("lake") ? .82 : .12); }'
          if (-not $text.Contains($oldObject)) { throw 'Map closed-object block not found.' }
          $text = $text.Replace($oldObject, $newObject)
          Set-Content -Path $editor -Value $text -Encoding utf8

          $exporter = 'src/ui/MapExporterProduct.cpp'
          $text = Get-Content $exporter -Raw
          $oldExport = @'
              } else if (type == QStringLiteral("road")) {
                  const QColor road = themeColor(pilin, QStringLiteral("road"), QColor(QStringLiteral("#75512f")));
          '@.Trim()
          $newExport = @'
              } else if (type == QStringLiteral("lake")) {
                  const QColor water = themeColor(pilin, QStringLiteral("river"), QColor(QStringLiteral("#2d6382")));
                  QColor fill = water.lighter(145);
                  fill.setAlphaF(std::clamp(object.value(QStringLiteral("fillOpacity")).toDouble(.82), 0.0, 1.0));
                  painter.setPen(QPen(water.darker(135), std::max(1.0, width * .7), Qt::SolidLine, Qt::RoundCap, Qt::RoundJoin));
                  painter.setBrush(fill);
                  painter.drawPath(path);
              } else if (type == QStringLiteral("road")) {
                  const QColor road = themeColor(pilin, QStringLiteral("road"), QColor(QStringLiteral("#75512f")));
          '@.Trim()
          if (-not $text.Contains($oldExport)) { throw 'Map exporter lake insertion point not found.' }
          $text = $text.Replace($oldExport, $newExport)
          Set-Content -Path $exporter -Value $text -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (git status --porcelain) {
            git add src/ui/PilinReyEditorProduct.cpp src/ui/MapExporterProduct.cpp
            git commit -m "map: add editable lake geometry and export"
            git push origin HEAD:main
          }

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:\Qt --modules qtmultimedia

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="C:\Qt\6.8.3\msvc2022_64"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      # Validation only. No RC/release is published by this workflow.
